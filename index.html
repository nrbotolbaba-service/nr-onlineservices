<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Cartoon Animated Login & Sign Up</title>
    <!-- GSAP Core Library (ভিডিওর মতো অ্যানিমেশনের জন্য) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #00b894; /* ভিডিওর মতো গ্রিন স্ক্রিন ব্যাকগ্রাউন্ড */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* অ্যানিমেটেড টম ক্যারেক্টার */
        .tom-character {
            position: absolute;
            width: 150px;
            height: auto;
            z-index: 10;
            bottom: 20px; /* শুরুর পজিশন স্ক্রিনের নিচে ও বামে */
            left: -200px; 
            pointer-events: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 400px;
            text-align: center;
            position: relative;
            color: #fff;
            opacity: 0; /* শুরুতে প্যানেলটি অদৃশ্য থাকবে, টম আসার পর শো করবে */
            transform: translateY(30px);
        }

        /* টম প্যানেলে বসার জন্য নির্দিষ্ট জায়গা */
        .character-holder {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid #fff;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* প্যানেলে সেট হওয়া টম ইমেজ */
        .character-holder img {
            width: 100%;
            height: auto;
            opacity: 0; /* শুরুতে এটি ফাঁকা থাকবে */
            transform: scale(0.5);
            transition: opacity 0.3s, transform 0.5s ease;
        }

        h2 {
            margin-bottom: 5px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        p {
            font-size: 12px;
            color: #dfe6e9;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            outline: none;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #eee;
        }

        .input-group input:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #00b894;
            border: none;
            outline: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background: #dfe6e9;
            transform: translateY(-2px);
        }

        .switch-form {
            margin-top: 20px;
            font-size: 14px;
        }

        .switch-form a {
            color: #fff;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- ১. অ্যানিমেটেড এন্ট্রি করার জন্য আলাদা টম ইমেজ -->
    <img src="https://i.ibb.co/vYm6gPq/tom-transparent.png" class="tom-character" id="moving-tom" alt="Walking Tom">

    <div class="container" id="login-container">
        <!-- ২. টমের ফাইনাল ডেস্টিনেশন হোল্ডার -->
        <div class="character-holder">
            <img src="https://i.ibb.co/vYm6gPq/tom-transparent.png" id="final-tom" alt="Tom Frame">
        </div>

        <!-- REGISTER FORM -->
        <div id="register-panel" class="form-panel active">
            <h2>Register Now</h2>
            <p>Please enter your details to sign up</p>
            
            <form id="reg-form" onsubmit="event.preventDefault();">
                <div id="step-1">
                    <div class="input-group">
                        <input type="text" placeholder="First Name" required>
                    </div>
                    <div class="input-group">
                        <input type="text" placeholder="Last Name" required>
                    </div>
                    <button type="button" class="btn" onclick="nextStep()">NEXT</button>
                </div>

                <div id="step-2" style="display: none;">
                    <div class="input-group">
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn">SUBMIT</button>
                </div>
            </form>

            <div class="switch-form">
                Already have an account? <a onclick="toggleForm('login')">Sign In</a>
            </div>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-panel" class="form-panel">
            <h2>Welcome Back</h2>
            <p>Please log in to your account</p>
            
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">LOG IN</button>
            </form>

            <div class="switch-form">
                Don't have an account? <a onclick="toggleForm('register')">Register Here</a>
            </div>
        </div>
    </div>

    <!-- GSAP Entry Animation Script -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const tl = gsap.timeline();

            // ধাপ ১: টম বাম পাশ থেকে হেঁটে স্ক্রিনের মাঝখানে (প্যানেলের পেছনে) আসবে
            tl.to("#moving-tom", {
                left: "calc(50% - 75px)", // স্ক্রিনের ঠিক মাঝখানে আসবে
                bottom: "calc(50% + 40px)", // প্যানেলের বৃত্তের পজিশন অনুযায়ী উপরে উঠবে
                duration: 2,
                ease: "power2.out"
            });

            // ধাপ ২: টম গোল ফ্রেমে ঢোকার সাথে সাথে মেইন লগইন প্যানেলটি শো করবে (Fade In)
            tl.to("#login-container", {
                opacity: 1,
                y: 0,
                duration: 0.5,
                ease: "power1.out"
            }, "-=0.3"); // টম পৌঁছানোর সামান্য আগে প্যানেল আসবে

            // ধাপ ৩: চলন্ত টমটি অদৃশ্য হয়ে যাবে এবং ফ্রেমের ভেতরের স্থায়ী টমটি পপ-আপ হবে
            tl.to("#moving-tom", {
                opacity: 0,
                duration: 0.1,
                onComplete: () => {
                    const finalTom = document.getElementById('final-tom');
                    finalTom.style.opacity = '1';
                    finalTom.style.transform = 'scale(1)';
                }
            });
        });

        // Next বাটনের কাজ
        function nextStep() {
            gsap.to("#step-1", {opacity: 0, duration: 0.2, onComplete: () => {
                document.getElementById('step-1').style.display = 'none';
                const step2 = document.getElementById('step-2');
                step2.style.display = 'block';
                gsap.fromTo(step2, {opacity: 0, y: 10}, {opacity: 1, y: 0, duration: 0.3});
            }});
        }

        // ফর্ম স্যুইচিং (Login / Register)
        function toggleForm(formType) {
            const regPanel = document.getElementById('register-panel');
            const logPanel = document.getElementById('login-panel');

            if (formType === 'login') {
                regPanel.classList.remove('active');
                logPanel.classList.add('active');
                gsap.fromTo(logPanel, {opacity: 0}, {opacity: 1, duration: 0.4});
            } else {
                logPanel.classList.remove('active');
                regPanel.classList.add('active');
                document.getElementById('step-1').style.display = 'block';
                document.getElementById('step-2').style.style.display = 'none';
                gsap.fromTo(regPanel, {opacity: 0}, {opacity: 1, duration: 0.4});
            }
        }
    </script>
</body>
</html>
