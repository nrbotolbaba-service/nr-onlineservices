<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NR Online Services | Login & Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: #0b111a; 
            background-image: radial-gradient(circle at 50% 0%, #1a2a3a 0%, #0b111a 80%); 
            color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        .glass { 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); 
        }
        nav { width: 100%; max-width: 450px; padding: 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; justify-content: center; }
        nav img { width: 40px; height: 40px; border: 2px solid #c5a059; border-radius: 50%; }
        nav span { color: #c5a059; font-weight: 700; letter-spacing: 1px; }

        .container { width: 100%; max-width: 400px; padding: 30px; text-align: center; }
        .tab-btn { display: flex; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab-btn button { flex: 1; padding: 10px; background: none; border: none; color: #aaa; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .tab-btn button.active { color: #c5a059; border-bottom: 2px solid #c5a059; }

        .form-box { display: none; }
        .form-box.active { display: block; }

        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; color: #ccc; font-size: 12px; margin-bottom: 5px; margin-left: 5px; }
        input { width: 100%; padding: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; outline: none; }
        input:focus { border-color: #c5a059; }

        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #c5a059 0%, #8e6d31 100%); border: none; border-radius: 10px; color: #000; font-weight: 700; cursor: pointer; margin-top: 10px; }
        #status-msg { margin-top: 15px; font-size: 13px; }
    </style>
</head>
<body>

    <nav class="glass">
        <img src="30055.png" alt="NR Logo">
        <span>NR ONLINE SERVICES</span>
    </nav>

    <div class="container glass">
        <div class="tab-btn">
            <button id="loginTab" class="active" onclick="showForm('login')">LOGIN</button>
            <button id="regTab" onclick="showForm('reg')">REGISTER</button>
        </div>

        <div id="loginForm" class="form-box active">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="example@mail.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button class="btn" onclick="handleLogin()">Log In</button>
        </div>

        <form id="regForm" class="form-box">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="Name" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="Email Address" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="Password" required>
            </div>
            <div class="input-group">
                <label>WhatsApp Number</label>
                <input type="text" name="WhatsApp Number" value="+968 7133 6522" required>
            </div>
            <button type="submit" class="btn">Register Now</button>
        </form>

        <p id="status-msg"></p>
    </div>

    <script>
        const scriptURL = 'আপনার_ওয়েব_অ্যাপ_URL_এখানে';

        function showForm(type) {
            document.querySelectorAll('.form-box').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.tab-btn button').forEach(b => b.classList.remove('active'));
            if(type === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.getElementById('loginTab').classList.add('active');
            } else {
                document.getElementById('regForm').classList.add('active');
                document.getElementById('regTab').classList.add('active');
            }
        }

        // Registration Logic
        document.getElementById('regForm').addEventListener('submit', e => {
            e.preventDefault();
            const msg = document.getElementById('status-msg');
            msg.innerText = "Processing...";
            fetch(scriptURL, { method: 'POST', body: new FormData(e.target)})
            .then(() => {
                msg.style.color = "#c5a059";
                msg.innerText = "Registration Successful! Please Login.";
                e.target.reset();
                setTimeout(() => showForm('login'), 2000);
            });
        });

        // Login Logic (Simplified)
        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const msg = document.getElementById('status-msg');

            if(email && pass) {
                msg.style.color = "#c5a059";
                msg.innerText = "Checking credentials...";

                // এখানে আপনি আপনার সার্ভিস পেজের লিঙ্ক দিবেন
                // আপাতত এটি সাকসেস মেসেজ দেখাবে
                setTimeout(() => {
                    alert("Welcome back! Redirecting to Dashboard...");
                    // window.location.href = "dashboard.html"; 
                }, 2000);
            } else {
                msg.style.color = "#ff4d4d";
                msg.innerText = "Please enter email and password.";
            }
        }
    </script>
</body>
</html>
