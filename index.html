<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NR Online Service - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #0d1117;
            color: #ffffff;
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #3b82f6;
            outline: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto shadow-xl shadow-blue-900/40 mb-4">
                <i class="fas fa-server text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold">NR Online <span class="text-blue-500">Service</span></h1>
            <p class="text-gray-400 text-sm mt-1">চালিয়ে যেতে লগইন করুন</p>
        </div>

        <div class="bg-gray-900/50 p-8 rounded-[32px] border border-gray-800 backdrop-blur-xl">
            <form action="#" class="space-y-6">

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 ml-1">ইউজারনেম বা ইমেইল</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                            <i class="far fa-envelope"></i>
                        </span>
                        <input type="text" placeholder="username@example.com" 
                               class="glass-input w-full pl-11 pr-4 py-4 rounded-2xl text-sm placeholder-gray-600">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 ml-1">পাসওয়ার্ড</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" placeholder="••••••••" 
                               class="glass-input w-full pl-11 pr-4 py-4 rounded-2xl text-sm placeholder-gray-600">
                    </div>
                    <div class="text-right mt-2">
                        <a href="#" class="text-xs text-blue-500 hover:underline">পাসওয়ার্ড ভুলে গেছেন?</a>
                    </div>
                </div>

                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-900/30 transition-all active:scale-[0.98]">
                    সাইন ইন করুন
                </button>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-800"></div>
                    <span class="flex-shrink mx-4 text-gray-600 text-xs uppercase tracking-widest">অথবা</span>
                    <div class="flex-grow border-t border-gray-800"></div>
                </div>

                <button type="button" 
                        class="w-full glass-input hover:bg-white/10 flex items-center justify-center gap-3 py-4 rounded-2xl font-semibold text-sm transition-all">
                    <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5 h-5" alt="Google">
                    গুগল দিয়ে প্রবেশ করুন
                </button>
            </form>
        </div>

        <p class="text-center mt-8 text-sm text-gray-500">
            অ্যাকাউন্ট নেই? <a href="#" class="text-blue-500 font-bold hover:underline">নতুন তৈরি করুন</a>
        </p>
    </div>

</body>
</html>
