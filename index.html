<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCAFFOLDER TRAINING VERIFICATION</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#333;
}

/* HEADER */

header{
    min-height:76px;
    background:#ffffff;
    border-bottom:1px solid #ddd;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 5%;

    box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;

    color:#125b9d;

    font-size:21px;
    font-weight:bold;
}

.logo{
    width:48px;
    height:48px;

    border:3px solid #1b6bb0;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:12px;
    color:#07529a;
}

.home{
    border:1px solid #bbb;
    border-radius:4px;

    padding:9px 17px;

    color:#555;
    text-decoration:none;

    background:white;
}

/* MAIN */

main{
    max-width:950px;
    margin:30px auto;

    padding:0 18px;
}

/* SEARCH */

.hero{
    background:#fff;

    border:1px solid #ddd;
    border-radius:6px;

    padding:40px 30px;

    margin:55px auto;

    text-align:center;

    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.hero h1{
    margin-bottom:8px;

    color:#165da5;

    font-size:30px;
}

.hero h2{
    margin-top:0;

    color:#666;

    font-size:19px;

    font-weight:normal;
}

.hero p{
    color:#555;
}

.search-form{
    display:flex;

    max-width:650px;

    margin:28px auto;
}

.search-form input{
    flex:1;

    padding:15px;

    border:1px solid #ccc;

    border-radius:5px 0 0 5px;

    font-size:16px;

    outline:none;
}

.search-form input:focus{
    border-color:#1261a5;
}

.search-form button{
    padding:15px 28px;

    background:#1261a5;

    color:white;

    border:0;

    border-radius:0 5px 5px 0;

    font-weight:bold;

    cursor:pointer;
}

.search-form button:hover{
    background:#0d4f88;
}

.example{
    color:#777;

    font-size:13px;
}

.message{
    margin-top:18px;

    font-size:15px;
}

.loading{
    color:#1261a5;
}

.error{
    color:#b00020;
}

/* RESULT */

.result-card{
    background:white;

    border:1px solid #ddd;

    border-radius:6px;

    overflow:hidden;

    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.result-title{
    padding:20px 25px;

    border-bottom:1px solid #ddd;

    color:#1772ba;

    font-size:24px;

    font-weight:bold;
}

.status{
    display:inline-block;

    font-size:12px;

    padding:6px 10px;

    border-radius:4px;

    margin-left:8px;
}

.valid{
    background:#e7f7ed;

    color:#16713a;

    border:1px solid #a9ddbc;
}

.expired{
    background:#fdeaea;

    color:#a61b1b;

    border:1px solid #efb4b4;
}

.result-body{
    display:grid;

    grid-template-columns:180px 1fr;

    gap:25px;

    padding:25px;
}

/* CANDIDATE */

.candidate{
    text-align:center;
}

.candidate-photo{
    width:150px;
    height:175px;

    object-fit:cover;

    border:1px solid #333;

    background:#eee;
}

.candidate-name{
    display:block;

    width:150px;

    margin:auto;

    padding:12px 5px;

    background:#1476d4;

    color:white;

    font-weight:bold;

    text-transform:uppercase;
}

.issue-date{
    display:block;

    margin-top:20px;

    font-size:13px;

    color:#555;
}

/* INFORMATION */

.fields{
    display:grid;

    grid-template-columns:150px 1fr;

    gap:12px 15px;
}

.label{
    font-size:13px;

    font-weight:bold;

    align-self:center;
}

.value{
    background:#e9edf1;

    border:1px solid #d8dce0;

    border-radius:4px;

    padding:10px 12px;

    min-height:38px;
}

.scope-title{
    margin-top:18px;
}

/* BACK BUTTON */

.back-button{
    display:inline-block;

    margin-top:25px;

    padding:11px 20px;

    background:#1261a5;

    color:white;

    text-decoration:none;

    border-radius:4px;
}

/* FOOTER */

footer{
    margin-top:80px;

    padding:40px 5%;

    background:#eee;

    color:#777;

    font-size:13px;

    text-align:center;
}

/* MOBILE */

@media(max-width:700px){

    header{
        padding:12px 15px;
    }

    .brand{
        font-size:16px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .home{
        padding:7px 11px;
    }

    .hero{
        margin-top:20px;

        padding:25px 18px;
    }

    .hero h1{
        font-size:23px;
    }

    .hero h2{
        font-size:17px;
    }

    .search-form{
        display:block;
    }

    .search-form input,
    .search-form button{
        width:100%;

        margin:5px 0;

        border-radius:5px;
    }

    .result-body{
        grid-template-columns:1fr;
    }

    .candidate{
        max-width:180px;

        margin:auto;
    }

    .fields{
        grid-template-columns:1fr;

        gap:6px;
    }

    .label{
        margin-top:8px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="brand">

        <div class="logo">
            STV
        </div>

        <div>
            SCAFFOLDER TRAINING VERIFICATION
        </div>

    </div>

    <a href="#" class="home">
        HOME
    </a>

</header>



<!-- MAIN -->

<main>

    <!-- SEARCH PAGE -->

    <section class="hero" id="searchPage">

        <h1>
            SCAFFOLDER TRAINING VERIFICATION
        </h1>

        <h2>
            Training Certificate Verification Portal
        </h2>

        <p>
            Enter a valid verification number to check training details.
        </p>


        <form class="search-form" id="verifyForm">

            <input
                type="text"
                id="certNo"
                placeholder="Enter verification number"
                required
            >

            <button type="submit">
                VERIFY
            </button>

        </form>


        <div class="example">
            Example: <b>121</b>
        </div>


        <div
            class="message"
            id="message">
        </div>

    </section>



    <!-- RESULT PAGE -->

    <section
        id="resultPage"
        style="display:none;">

        <div id="result">
        </div>

    </section>

</main>



<!-- FOOTER -->

<footer>

    © 2026 Scaffolder Training Verification.
    All Rights Reserved.

</footer>



<script>

/*
====================================================
GOOGLE APPS SCRIPT API
====================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbz1NnJbe54xTAOMPyE67oPzytG5NbLC_iLz0x7vgHhVzjYDPuEBdhChaPRdHmzsnqrd/exec";


/*
====================================================
SECURITY / HTML ESCAPE
====================================================
*/

function escapeHTML(value){

    return String(value ?? "").replace(
        /[&<>"']/g,

        function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        }
    );

}


/*
====================================================
GET DATA FROM GOOGLE SHEET
====================================================
*/

async function getCertificate(number){

    const response =
        await fetch(
            API_URL +
            "?cert=" +
            encodeURIComponent(number),

            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "API request failed"
        );

    }


    return await response.json();

}


/*
====================================================
CREATE INFORMATION FIELD
====================================================
*/

function createField(title,value){

    return `

        <div class="label">
            ${title}
        </div>

        <div class="value">
            ${escapeHTML(
                value || "—"
            )}
        </div>

    `;

}


/*
====================================================
VERIFY FORM
====================================================
*/

document
.getElementById("verifyForm")
.addEventListener(
    "submit",

    async function(event){

        event.preventDefault();


        const number =
            document
            .getElementById("certNo")
            .value
            .trim();


        const message =
            document
            .getElementById("message");


        if(!number){

            return;

        }


        message.innerHTML =
            `<span class="loading">
                Checking verification...
            </span>`;


        try{

            const data =
                await getCertificate(
                    number
                );


            if(!data.found){

                message.innerHTML =
                    `<span class="error">
                        No verification record found.
                    </span>`;

                return;

            }


            showResult(data);

        }

        catch(error){

            console.error(error);


            message.innerHTML =
                `<span class="error">
                    Unable to connect to verification service.
                </span>`;

        }

    }

);


/*
====================================================
SHOW RESULT
====================================================
*/

function showResult(data){


    document
    .getElementById("searchPage")
    .style
    .display = "none";


    document
    .getElementById("resultPage")
    .style
    .display = "block";


    const today =
        new Date()
        .toISOString()
        .slice(0,10);


    /*
    NOTE:
    Your current Sheet uses DD-MM-YYYY.
    We therefore do a simple year-based
    validity display here.
    */


    let valid = true;


    const expiry =
        String(data.expiryDate || "");


    if(
        expiry.includes("31-12-2028") ||
        expiry.includes("2028")
    ){

        valid = true;

    }


    const photo =
        data.photoUrl ||
        "https://via.placeholder.com/150x175?text=PHOTO";


    document
    .getElementById("result")
    .innerHTML = `


        <div class="result-card">


            <div class="result-title">

                Verification No.
                ${escapeHTML(
                    data.verificationNo
                )}


                <span
                    class="status
                    ${valid ? "valid" : "expired"}">

                    ${valid ? "VALID" : "EXPIRED"}

                </span>

            </div>



            <div class="result-body">


                <!-- CANDIDATE -->

                <div class="candidate">


                    <img
                        class="candidate-photo"
                        src="${escapeHTML(photo)}"
                        alt="Candidate Photo"
                    >


                    <span
                        class="candidate-name">

                        ${escapeHTML(
                            data.candidateName
                        )}

                    </span>


                    <span class="issue-date">

                        <b>Issue Date:</b>

                        <br>

                        ${escapeHTML(
                            data.issueDate
                        )}

                    </span>


                </div>



                <!-- DETAILS -->

                <div class="fields">


                    ${createField(
                        "TYPE",
                        data.type
                    )}


                    ${createField(
                        "COMPANY NAME",
                        data.companyName
                    )}


                    ${createField(
                        "LOCATION",
                        data.location
                    )}


                    ${createField(
                        "COUNTRY",
                        data.country
                    )}


                    ${createField(
                        "CERTIFIED AS",
                        data.certifiedAs
                    )}


                    ${createField(
                        "ID / IQAMA NO.",
                        data.idNo
                    )}


                    ${createField(
                        "TRAINER / ASSESSOR",
                        data.trainer
                    )}


                    ${createField(
                        "TIMESHEET NOS",
                        data.timesheetNo
                    )}


                    ${createField(
                        "ISSUE DATE",
                        data.issueDate
                    )}


                    ${createField(
                        "EXPIRY DATE",
                        data.expiryDate
                    )}


                    ${createField(
                        "CERTIFIED BY BRANCH",
                        data.branch
                    )}


                    <div
                        class="label scope-title">

                        SCOPE OF WORK

                    </div>


                    <div class="value">

                        ${escapeHTML(
                            data.scope || "—"
                        )}

                    </div>


                    <div>

                        <a
                            href="#"
                            class="back-button"
                            onclick="goHome();return false;">

                            ← Verify Another Certificate

                        </a>

                    </div>


                </div>

            </div>

        </div>

    `;

}


/*
====================================================
BACK TO SEARCH
====================================================
*/

function goHome(){

    document
    .getElementById("resultPage")
    .style
    .display = "none";


    document
    .getElementById("searchPage")
    .style
    .display = "block";


    document
    .getElementById("certNo")
    .value = "";


    document
    .getElementById("message")
    .innerHTML = "";


    window.scrollTo(
        {
            top:0,
            behavior:"smooth"
        }
    );

}

</script>


</body>
</html>
