<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NR অনলাইন সেবা - রেজিস্ট্রেশন ও লগইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="auth-container" class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-700">NR Service</h1>
            <p id="form-subtitle" class="text-gray-500 mt-2">অ্যাকাউন্টে প্রবেশ করুন</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div class="relative">
                <i class="fas fa-envelope absolute left-4 top-4 text-gray-400"></i>
                <input type="email" id="l-email" placeholder="আপনার জিমেইল" class="w-full pl-12 pr-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div class="relative">
                <i class="fas fa-lock absolute left-4 top-4 text-gray-400"></i>
                <input type="password" id="l-pass" placeholder="পাসওয়ার্ড" class="w-full pl-12 pr-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">লগইন</button>
            <p class="text-center text-sm text-red-500 font-bold" id="msg"></p>
            <p class="text-center text-sm">নতুন ইউজার? <a href="#" onclick="toggleAuth()" class="text-indigo-600 font-bold">রেজিস্ট্রেশন করুন</a></p>
        </form>

        <form id="reg-form" class="hidden space-y-4">
            <input type="text" id="r-name" placeholder="পুরো নাম" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" required>
            <input type="email" id="r-email" placeholder="আসল জিমেইল আইডি" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" required>
            <input type="password" id="r-pass" placeholder="নতুন পাসওয়ার্ড" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" required>
            <input type="text" id="r-wa" placeholder="হোয়াটসঅ্যাপ নম্বর" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" required>
            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition">আবেদন জমা দিন</button>
            <p class="text-center text-sm">ইতিমধ্যেই অ্যাকাউন্ট আছে? <a href="#" onclick="toggleAuth()" class="text-indigo-600 font-bold">লগইন করুন</a></p>
        </form>
    </div>

    <script>
        // আপনার কপি করা লিঙ্কটি নিচে উদ্ধৃতি চিহ্নের ভেতর দিন
        const SCRIPT_URL = 'আপনার_কপি_করা_লিঙ্ক_এখানে_বসান';

        function toggleAuth() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('reg-form').classList.toggle('hidden');
            document.getElementById('form-subtitle').innerText = 
                document.getElementById('reg-form').classList.contains('hidden') ? 'অ্যাকাউন্টে প্রবেশ করুন' : 'নতুন আবেদন জমা দিন';
        }

        // রেজিস্ট্রেশন লজিক
        document.getElementById('reg-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = 'অপেক্ষা করুন...';
            
            const data = {
                action: 'register',
                name: document.getElementById('r-name').value,
                email: document.getElementById('r-email').value,
                password: document.getElementById('r-pass').value,
                whatsapp: document.getElementById('r-wa').value
            };

            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            const result = await res.text();
            
            if(result === "Success") {
                alert('আবেদন সফল! এডমিন অনুমোদন দিলে আপনি লগইন করতে পারবেন।');
                toggleAuth();
            } else {
                alert('এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট খোলা হয়েছে।');
            }
            btn.innerText = 'আবেদন জমা দিন';
        };

        // লগইন লজিক
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.innerText = "যাচাই করা হচ্ছে...";
            
            const data = {
                action: 'login',
                email: document.getElementById('l-email').value,
                password: document.getElementById('l-pass').value
            };

            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            const result = await res.text();
            
            if(result === "Login Success") {
                alert('লগইন সফল!');
                // এখানে আপনার আসল ড্যাশবোর্ডের লিঙ্ক দিতে পারেন
                window.location.href = 'https://আপনার_ড্যাশবোর্ড_লিঙ্ক.com'; 
            } else if(result === "Not Approved") {
                msg.innerText = "আপনার অ্যাকাউন্ট এখনো অনুমোদিত হয়নি!";
            } else {
                msg.innerText = "ভুল ইমেইল অথবা পাসওয়ার্ড!";
            }
        };
    </script>
</body>
</html>
