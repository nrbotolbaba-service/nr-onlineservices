<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Cartoon Login & Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #00b894; /* ভিডিওর মতো গ্রিন স্ক্রিন ব্যাকগ্রাউন্ড */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
            position: relative;
            color: #fff;
        }

        /* Tom কার্টুন ইমেজের স্টাইল */
        .character-box {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            overflow: hidden;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .character-box img {
            width: 110%;
            height: auto;
            object-fit: cover;
            transform: translateY(5px);
        }

        h2 {
            margin-bottom: 5px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        p {
            font-size: 12px;
            color: #dfe6e9;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            outline: none;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #eee;
        }

        .input-group input:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #00b894;
            border: none;
            outline: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background: #dfe6e9;
            transform: translateY(-2px);
        }

        .switch-form {
            margin-top: 20px;
            font-size: 14px;
        }

        .switch-form a {
            color: #fff;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
        }

        /* ফর্ম স্যুইচিং অ্যানিমেশন ও হাইড করার জন্য */
        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tom কার্টুন এর ইমেজ এরিয়া -->
        <div class="character-box">
            <!-- এখানে একটি চমৎকার Tom এর স্বচ্ছ (PNG) ইমেজ ব্যবহার করা হয়েছে -->
            <img src="https://i.ibb.co/vYm6gPq/tom-transparent.png" alt="Tom Cartoon" id="cartoon-tom">
        </div>

        <!-- ================= SIGN UP / REGISTER FORM ================= -->
        <div id="register-panel" class="form-panel active">
            <h2>Register Now</h2>
            <p>Fill up this form to participate in our online session</p>
            
            <form id="reg-form" onsubmit="event.preventDefault();">
                <!-- প্রথম ধাপ: নাম ইনপুট -->
                <div id="step-1">
                    <div class="input-group">
                        <input type="text" placeholder="First Name" required>
                    </div>
                    <div class="input-group">
                        <input type="text" placeholder="Last Name" required>
                    </div>
                    <button type="button" class="btn" onclick="nextStep()">NEXT</button>
                </div>

                <!-- দ্বিতীয় ধাপ: ইমেইল ও পাসওয়ার্ড (Next বাটনে ক্লিক করলে আসবে) -->
                <div id="step-2" style="display: none;">
                    <div class="input-group">
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn">SUBMIT</button>
                </div>
            </form>

            <div class="switch-form">
                Already have an account? <a onclick="toggleForm('login')">Sign In</a>
            </div>
        </div>

        <!-- ================= LOGIN FORM ================= -->
        <div id="login-panel" class="form-panel">
            <h2>Welcome Back</h2>
            <p>Please log in to your account</p>
            
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">LOG IN</button>
            </form>

            <div class="switch-form">
                Don't have an account? <a onclick="toggleForm('register')">Register Here</a>
            </div>
        </div>
    </div>

    <!-- JavaScript - ফর্মের গতিবিধি নিয়ন্ত্রণ করার জন্য -->
    <script>
        // Sign Up ফর্মের "Next" বাটনের কাজ
        function nextStep() {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            
            // অ্যানিমেশনসহ প্রথম স্টেপ লুকিয়ে দ্বিতীয় স্টেপ দেখাবে
            step1.style.display = 'none';
            step2.style.display = 'block';
            step2.style.animation = 'fadeIn 0.5s ease-in-out';
            
            // আপনি চাইলে এখানে টম-এর ইমেজ পরিবর্তন বা রিল্যাক্সিং কোনো এক্সপ্রেশন দিতে পারেন
            document.getElementById('cartoon-tom').style.transform = 'scale(1.1) translateY(5px)';
        }

        // Login এবং Register প্যানেলের মধ্যে স্যুইচ করার কাজ
        function toggleForm(formType) {
            const registerPanel = document.getElementById('register-panel');
            const loginPanel = document.getElementById('login-panel');
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');

            if (formType === 'login') {
                registerPanel.classList.remove('active');
                loginPanel.classList.add('active');
            } else {
                loginPanel.classList.remove('active');
                registerPanel.classList.add('active');
                // রেজিস্টার ফর্মে ফিরে গেলে আবার প্রথম স্টেপ থেকে শুরু হবে
                step1.style.display = 'block';
                step2.style.display = 'none';
                document.getElementById('cartoon-tom').style.transform = 'scale(1) translateY(5px)';
            }
        }
    </script>
</body>
</html>
